n the gates.","Proverbs 31:31"]];

/* ---------- Money maths ---------- */
function fee(a){return a<=100?0:a<=500?2.5:a<=1000?5:a<=1500?18:a<=2500?20:25}
/* Fuliza: estimated cost so far. Daily fee is set by the principal still owed. */
function fzCost(f,upTo){const fa=(S.fa??1)/100,fe=(S.fe??20)/100,end=f.done&&f.dd?f.dd:(upTo||today()),days=Math.max(0,Math.round((new Date(end+"T00:00")-new Date(f.d+"T00:00"))/864e5)),left=f.a-(f.rp||0),ch=Math.max(0,days-(f.a<=1000?3:0)),dl=ch*fee(left),acc=f.acc!=null?f.acc:f.a*fa;return{days,acc,daily:dl,ex:dl*fe,tot:acc+dl*(1+fe)}}
const fzOwed=f=>f.done?0:Math.max(0,f.a-(f.rp||0))+Math.max(0,fzCost(f).tot-(f.fp||0));
const fzOpen=(p,sim)=>p.fz.filter(f=>!f.done&&(!sim||simOf(f)==sim)).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);
const fzTotal=(p,sim)=>fzOpen(p,sim).reduce((s,f)=>s+fzOwed(f),0);
const fzAuto=p=>p.zf&&p.fza!==false;
const fzLimit=(p,sim)=>+((p.fzl||{})[sim])||0;
/* Money received pays Fuliza first: fees, then what was borrowed, oldest first (Safaricom's order). Returns amount used. */
function repayFz(p,amt,date,pot,lk,note,sim,at){let left=Math.round(amt*100)/100,used=0,k=0;const TS=()=>at?at+(++k)/1000:nts();for(const f of fzOpen(p,sim)){if(left<=0)break;
 const feeDue=Math.max(0,Math.round((fzCost(f,date).tot-(f.fp||0))*100)/100),fp=Math.min(left,feeDue);left-=fp;
 const pr=Math.min(left,f.a-(f.rp||0));left-=pr;
 if(fp>0){f.fp=(f.fp||0)+fp;p.tx.push({id:uid(),ts:TS(),at:today(),d:date,t:"out",b:f.b||"p",s:pot,a:fp,m:"M-Pesa",sim:simOf(f),who:"Fuliza fees",c:"Fuliza fees",n:note||"taken by M-Pesa",fzid:f.id,fzk:"fp",lk})}
 if(pr>0){f.rp=(f.rp||0)+pr;p.tx.push({id:uid(),ts:TS(),at:today(),d:date,t:"out",b:f.b||"p",s:pot,rp:1,a:pr,m:"M-Pesa",sim:simOf(f),who:"Fuliza repayment",c:"Fuliza repayment",n:note||"taken by M-Pesa",fzid:f.id,fzk:"rp",lk})}
 used+=fp+pr;if(f.a-(f.rp||0)<=0.009){f.done=true;f.dd=date;f.cost=f.fp||0}}return used}
/* Undo a repayment's effect on its Fuliza when that entry is deleted (sign -1) or restored (+1) */
function fzApply(p,x,sign){if(!x.fzid)return;const f=p.fz.find(y=>y.id==x.fzid);if(!f)return;f[x.fzk]=(f[x.fzk]||0)+sign*x.a;f.done=f.a-(f.rp||0)<=0.009;if(f.done){f.cost=f.fp||0}else delete f.dd}
/* Make what the app thinks you owe on a line equal what M-Pesa says. Corrections never count as spending. */
function setFzOwed(p,sim,amount,note){amount=Math.max(0,+amount||0);const cur=fzTotal(p,sim),diff=Math.round((amount-cur)*100)/100;if(Math.abs(diff)<1)return 0;
 if(diff>0){p.fz.push({id:uid(),sim,d:today(),a:diff,acc:0,b:"p",done:false,cor:1,n:note||"set to match M-Pesa"});return diff}
 let left=-diff;for(const f of fzOpen(p,sim).reverse()){if(left<=0.009)break;const o=fzOwed(f);
  if(o<=left+0.009){f.done=true;f.dd=today();f.cor=1;f.cost=f.fp||0;left-=o}
  else{const cut=Math.min(left,Math.max(0,f.a-(f.rp||0)));f.a-=cut;left-=cut;if(left>0.009){f.fp=(f.fp||0)+left;left=0}}}
 const rem=Math.round((fzTotal(p,sim)-amount)*100)/100,last=fzOpen(p,sim).pop();if(rem>=0.01&&last)last.fp=(last.fp||0)+rem;else if(rem<=-0.01)p.fz.push({id:uid(),sim,d:today(),a:-rem,acc:0,b:"p",done:false,cor:1,n:note||"set to match M-Pesa"});return diff}
let _ts=0;const nts=()=>{_ts=Math.max(Date.now(),_ts+1);return _ts};
/* Estimated M-Pesa balance per line: last known balance plus every M-Pesa entry on that line recorded since */
function walletBal(p,sim){sim=sim||SIM0();const w=(p.mpw||{})[sim];if(!w)return null;let v=w.v;p.tx.forEach(x=>{if((x.ts||0)<=w.ts||x.m!="M-Pesa"||simOf(x)!=sim)return;v+=x.t=="in"?x.a:-(x.a+(x.f||0)-(x.fzA||0))});return Math.round(v*100)/100}
function walletAll(p){let t=0,k=0;S.sims.forEach(s=>{const w=walletBal(p,s.id);if(w!=null){t+=Math.max(0,w);k++}});return k?t:null}
function bal(p){const o=p.ob||{},r={p:+o.p||0,b:+o.b||0};p.tx.forEach(x=>{if(x.t=="out"&&x.m=="Fuliza")return;const s=x.s||x.b||"p";if(r[s]==null)return;r[s]+=x.t=="in"?x.a:-(x.a+(x.f||0)-(x.fzA||0))});return r}
function sum(a){let i=0,o=0;a.forEach(x=>x.rp?0:x.t=="in"?i+=x.a:o+=x.a+(x.f||0));return{i,o}}
function by(a,k){const m={};a.forEach(x=>{const key=x[k]||"(not named)";m[key]=(m[key]||0)+x.a;if(x.f){const kk=k=="c"?"Transaction costs":key;m[kk]=(m[kk]||0)+x.f}});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
const spentIn=(p,ym,kind,cat)=>p.tx.filter(x=>x.t=="out"&&!x.rp&&ymOf(x.d)==ym&&(x.b||"p")==kind&&(cat?x.c==cat:true)).reduce((s,x)=>s+x.a+(cat?0:(x.f||0)),0);
const feesIn=a=>a.reduce((s,x)=>s+(x.f||0)+(x.okoa||0)*.1+(!x.rp&&x.t=="out"&&/Fuliza fees|Transaction costs/.test(x.c)?x.a:0),0);
const goalSaved=g=>g.saved.reduce((q,y)=>q+y.a,0);
function essentialAvg(p){const now=ymOf(today());let tot=0,n=0;for(let i=1;i<=3;i++){const ym=ymShift(now,-i);const v=p.tx.filter(x=>x.t=="out"&&!x.rp&&(x.b||"p")=="p"&&ymOf(x.d)==ym&&ESSENTIAL.includes(x.c)).reduce((s,x)=>s+x.a,0);if(v>0){tot+=v;n++}}
 if(!n){const v=p.tx.filter(x=>x.t=="out"&&!x.rp&&(x.b||"p")=="p"&&ymOf(x.d)==now&&ESSENTIAL.includes(x.c)).reduce((s,x)=>s+x.a,0);return{avg:v,n:0}}return{avg:tot/n,n}}
function streak(p){const days=new Set(Object.keys(p.chk||{}));p.tx.forEach(x=>{if(x.at)days.add(x.at)});let d=today(),n=0;if(!days.has(d))d=addDays(d,-1);while(days.has(d)){n++;d=addDays(d,-1)}return{n,todayDone:days.has(today())}}

function dueBills(p){const t=today(),ym=ymOf(t),out=[];p.bills.forEach(bl=>{const paid=p.tx.some(x=>x.bill==bl.id&&ymOf(x.d)==ym);if(paid)return;const last=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();const d=ym+"-"+String(Math.min(bl.day||1,last)).padStart(2,"0");if(d<=addDays(t,7))out.push([bl,d,d<t])});return out.sort((a,b)=>a[1].localeCompare(b[1]))}
function checkIn(){P().chk[today()]=1;save();render();confetti();toast("Candle lit. Today is recorded ✦")}

/* ---------- Plan (envelopes) ---------- */
function plan(){const p=P(),k=planK,ym=ymShift(ymOf(today()),planOff),bud=p.bud[k];
 const lastIn=p.tx.filter(x=>x.t=="in"&&!x.rp&&(x.b||"p")==k&&ymOf(x.d)==ymShift(ymOf(today()),-1)).reduce((s,x)=>s+x.a,0);
 const inc=+p.inc[k]||0,given=Object.values(bud).reduce((s,v)=>s+(+v||0),0),left=inc-given,giveAmt=Math.round(inc*(S.give||0)/100);
 const cats=[...new Set(catsFor(k).concat(Object.keys(bud).filter(c=>+bud[c]>0)))];
 const rows=cats.map(c=>{const b=+bud[c]||0,s=spentIn(p,ym,k,c),pc=b?s/b*100:0,col=!b?"var(--mut)":pc>100?"var(--out)":pc>=90?"var(--warn)":"var(--in)";
  return`<div class="env"><div class="row" style="border:0;padding:0"><span>${esc(c)}</span><input type="number" inputmode="decimal" value="${b||""}" placeholder="0" onchange="setBud('${esc(c)}',this.value)"></div>
  <div class="mut">Spent ${K(s)}${b?` · <span style="color:${col}">${s>b?K(s-b)+" over":K(b-s)+" left"}</span>`:""}</div>${b?`<div class="track"><div class="bar" style="width:${Math.min(100,pc)}%;background:${col}"></div></div>`:""}</div>`}).join("");
 const totS=spentIn(p,ym,k);
 return`<div class="seg"><button class="${k=="p"?"on":""}" onclick="planK='p';render()">Personal plan</button><button class="${k=="b"?"on":""}" onclick="planK='b';render()">Business plan</button></div>
 <div class="card"><b>Give every shilling a job</b><div class="mut">Decide where the month’s money goes before you spend it. Research on budgeting apps found people keep spending less for months after setting a budget, even when they don’t hit it exactly. So set it, and adjust it as you go.</div>
 <label>Money I expect in each month (${k=="p"?"personal":"business"})</label><input type="number" inputmode="decimal" value="${inc||""}" placeholder="${lastIn?"Last month: "+lastIn:"e.g. 60000"}" onchange="P().inc['${k}']=+this.value||0;save();render()">
 ${!inc&&lastIn?`<button class="g sm" style="margin-top:6px" onclick="P().inc['${k}']=${lastIn};save();render()">Use last month (${K(lastIn)})</button>`:""}
 ${inc?`<div class="row" style="margin-top:8px"><span>Not given a job yet</span><b class="${left<0?"out":left==0?"in":"warn"}">${left<0?K(-left)+" too much planned":left==0?"Every shilling has a job ✓":K(left)}</b></div>`:""}</div>
 ${k=="p"&&inc?`<div class="card hl"><b>Firstfruits</b> <span class="mut">“She stretcheth out her hand to the poor” 31:20</span><div class="mut">${S.give||0}% of what you expect in is ${K(giveAmt)}. You can change the % in Settings.</div>${(+bud["Church & giving"]||0)!=giveAmt?`<button class="g sm" style="margin-top:6px" onclick="setBud('Church & giving',${giveAmt})">Put ${K(giveAmt)} in Church &amp; giving</button>`:'<div class="in" style="margin-top:4px">Planned ✓</div>'}</div>`:""}
 <div class="row" style="border:0"><button class="g sm" onclick="planOff--;render()">‹</button><b>${monthName(ym)}</b><button class="g sm" onclick="planOff++;render()">›</button></div>
 <div class="card">${rows}<div class="row" style="border:0;padding-top:10px"><b>Total</b><b>${K(totS)} of ${K(given)}</b></div></div>
 <div class="card"><b>Anything unusual coming?</b><div class="mut">We tend to forget the unusual costs: school fees, a wedding or funeral contribution, a repair, a big restock, travel home. Studies found that thinking about these on purpose makes a plan much more accurate. Add an amount to <i>Unexpected</i> for them.</div></div>
 <h2>Bills and regular payments</h2>${billList(p)}<button onclick="openBill()">Add a bill or regular payment</button>`}
function setBud(c,v){P().bud[planK][c]=+v||0;save();render()}
function billList(p){const ym=ymOf(today());return`<div class="card">${p.bills.map(bl=>{const paid=p.tx.some(x=>x.bill==bl.id&&ymOf(x.d)==ym);return`<div class="row"><div><b>${esc(bl.name)}</b> ${bl.b=="b"?'<span class="pill">business</span>':""}<div class="mut">${K(bl.a)} · day ${bl.day} each month · ${esc(bl.c)}</div></div><div style="white-space:nowrap">${paid?'<span class="in">Paid ✓</span>':`<button class="sm" onclick="payBill(${bl.id})">Pay</button>`} <button class="x" onclick="openBill(${bl.id})">✎</button> <button class="x" onclick="delBill(${bl.id})">✕</button></div></div>`}).join("")||'<div class="mut">Rent, school fees, salaries, Wi-Fi, chama, tithe… add them once and they show up on Home when due.</div>'}</div>`}
function openBill(id){const bl=id?P().bills.find(b=>b.id==id):{day:1,b:"p"};openS(`<h2 style="margin-top:0">${id?"Edit bill":"New bill or regular payment"}</h2><label>Name</label><input id="bn" value="${esc(bl.name||"")}" placeholder="e.g. Rent, Wi-Fi, Wanjiru salary"><label>Amount (KSh)</label><input id="ba" type="number" inputmode="decimal" value="${bl.a||""}"><label>Day of the month it’s due</label><input id="bd" type="number" min="1" max="31" value="${bl.day||1}"><label>For</label><select id="bb" onchange="$('bcw').innerHTML=catSelect('bc',this.value,0,$('bc').value)"><option value="p" ${bl.b!="b"?"selected":""}>Personal</option><option value="b" ${bl.b=="b"?"selected":""}>Business</option></select><label>Category</label><div id="bcw">${catSelect("bc",bl.b,0,bl.c)}</div><br><button onclick="addBill(${id||0})">Save</button>`)}
function addBill(id){const a=+$("ba").value,n=$("bn").value.trim();if(!a||!n)return toast("Add a name and an amount");const o={name:n,a,day:Math.min(31,Math.max(1,+$("bd").value||1)),c:$("bc").value=="__new"?"Other":$("bc").value,b:$("bb").value};if(id)Object.assign(P().bills.find(b=>b.id==id),o);else P().bills.push({id:uid(),...o});save();closeS();render()}
async function delBill(id){if(await ask("Remove this bill? Past payments stay recorded.","Remove")){P().bills=P().bills.filter(b=>b.id!=id);save();render()}}
function payBill(id){const bl=P().bills.find(b=>b.id==id);draft={t:"out",b:bl.b,s:bl.b,a:bl.a,who:bl.name,c:bl.c,bill:bl.id};openTx()}

/* ---------- Owing ---------- */
function owe(){const p=P(),yr=today().slice(0,4),mo=ymOf(today());
 const fzFees=a=>p.tx.filter(x=>x.c=="Fuliza fees"&&a(x)).reduce((s,x)=>s+x.a,0);
 const simCard=s=>{const ow=fzTotal(p,s.id),lim=fzLimit(p,s.id),w=walletBal(p,s.id),o=fzOpen(p,s.id);
  return`<div class="card ${ow>0.5?"bad":""}"><div class="row" style="border:0;padding:0"><div><b>${multiSim()?esc(s.name)+" · ":""}Fuliza</b><div class="mut">${lim?`Limit ${K(lim)} · available ${K(Math.max(0,lim-ow))}`:"Limit not set"} · M-Pesa ${w==null?"—":K(Math.max(0,w))}</div></div><div class="big ${ow>0.5?"out":"in"}" style="white-space:nowrap">${ow>0.5?K(Math.round(ow)):"Clear ✓"}</div></div>
  ${lim&&ow>lim+1?`<div class="mut" style="margin-top:6px;color:var(--out)"><b>This is more than your limit</b>, so something was counted twice. Dial *234# → Fuliza M-PESA → Balance, then tap “Fix amount” and type that number.</div>`:""}
  <div class="btns"><button class="g sm" onclick="setOwePrompt('${s.id}')">Fix amount</button><button class="g sm" onclick="setLimPrompt('${s.id}')">Limit</button><button class="g sm" onclick="openFz(0,'${s.id}')">＋ Log</button></div>
  ${o.map(f=>{const c=fzCost(f);return`<div class="row" style="cursor:pointer" onclick="if(!event.target.closest('button'))openFz(${f.id})"><div><b>${K(f.a)}</b> <span class="mut">${f.cor?"correction":f.src?"covered a payment":"borrowed"} · ${f.d} · day ${c.days}${f.b=="b"?" · business":""}</span><div class="mut">Owe about ${K(fzOwed(f))}${f.rp||f.fp?` · repaid ${K((f.rp||0)+(f.fp||0))}`:""}</div></div><div style="white-space:nowrap"><button class="x" onclick="openFz(${f.id})" aria-label="Edit">✎</button> <button class="x" onclick="delFz(${f.id})" aria-label="Remove">✕</button></div></div>`}).join("")}</div>`};
 const done=p.fz.filter(f=>f.done).sort((a,b)=>(b.dd||b.d).localeCompare(a.dd||a.d)).slice(0,8);
 const fzPart=p.zf?`<h2>Fuliza</h2>${S.sims.map(simCard).join("")}
 <div class="grid"><div class="card"><div class="mut">Fuliza fees this month</div><div class="big out">${K(fzFees(x=>ymOf(x.d)==mo))}</div></div><div class="card"><div class="mut">Fuliza fees in ${yr}</div><div class="big out">${K(fzFees(x=>x.d.slice(0,4)==yr))}</div></div></div>
 <div class="card"><div class="row" style="border:0;padding:0"><div><b>Fuliza works automatically</b><div class="mut">${fzAuto(p)?"On: payments bigger than your M-Pesa balance are logged as Fuliza, money received pays Fuliza first, and M-Pesa’s own Fuliza messages correct the total.":"Off: log Fuliza yourself."}</div></div><button class="g sm" onclick="P().fza=!fzAuto(P());save();render()">${fzAuto(p)?"Turn off":"Turn on"}</button></div></div>
 <div class="card mut">Fuliza costs a one-off 1% access fee, then a daily fee set by how much you owe (KSh 0 up to KSh 25 a day, plus 20% excise). Up to KSh 1,000 is free of daily fees for 3 days. <b>Repay before midnight and you pay only the 1%.</b> Daily fees here are estimates; *234# has the exact figure.</div>
 ${done.length?`<h2>Repaid Fuliza</h2><div class="card" style="padding:4px 14px">${done.map(f=>`<div class="row" style="cursor:pointer" onclick="if(!event.target.closest('button'))openFz(${f.id})"><div><b>${K(f.a)}</b> <span class="mut">${f.d} → ${f.dd||"?"}${multiSim()?" · "+esc(simName(simOf(f))):""}${f.cor?" · correction":""}</span><div class="mut">Fees ${K(f.cost||f.fp||0)}</div></div><div style="white-space:nowrap"><button class="x" onclick="openFz(${f.id})">✎</button> <button class="x" onclick="delFz(${f.id})">✕</button></div></div>`).join("")}</div>`:""}`:"";
 const dl=dir=>p.debts.filter(d=>d.dir==dir).map(d=>{const pd=d.paid.reduce((s,x)=>s+x.a,0),l=d.a-pd;return`<div class="card"><div class="row" style="border:0;padding:0"><b>${esc(d.who)}</b><span class="${dir=="out"?"out":"in"}">${K(l)} left</span></div><div class="mut">${dir=="out"?"Borrowed":"Lent / sold on credit"} ${K(d.a)} · ${dir=="out"?"paid":"received"} ${K(pd)}${d.due?" · due "+d.due:""}${d.due&&l>0&&d.due<today()?' · <span class="out">overdue</span>':""}${dir=="out"&&l>0&&(d.mc||d.mp)?`<br>${d.mc?`Costs about <b class="out">${K(d.mc)}</b> a month in interest and fees`:""}${d.mc&&d.mp?" · ":""}${d.mp?(d.mp>(d.mc||0)?`at ${K(d.mp)} a month, cleared in about <b>${Math.ceil(l/(d.mp-(d.mc||0)))} months</b>`:`<span class="out">${K(d.mp)} a month doesn’t cover the interest</span>`):""}`:""}</div><div class="track"><div class="bar" style="width:${Math.min(100,pd/d.a*100)}%;background:var(--in)"></div></div><div class="btns">${l>0?`<button onclick="payDebt(${d.id})">${dir=="out"?"Make a payment":"Record money received"}</button>`:'<span class="in" style="align-self:center">Cleared ✓</span>'}<button class="x" style="flex:0" onclick="openDebt('${dir}',${d.id})">✎</button><button class="x" style="flex:0" onclick="delDebt(${d.id})">✕</button></div></div>`}).join("");
 const tO=p.debts.filter(d=>d.dir=="out").reduce((s,d)=>s+d.a-d.paid.reduce((q,x)=>q+x.a,0),0),tI=p.debts.filter(d=>d.dir=="in").reduce((s,d)=>s+d.a-d.paid.reduce((q,x)=>q+x.a,0),0);
 return`<div class="grid"><div class="card"><div class="mut">I owe</div><div class="big out">${K(tO+fzTotal(p))}</div></div><div class="card"><div class="mut">Owed to me</div><div class="big in">${K(tI)}</div></div></div>${fzPart}
 <h2>Debts I owe</h2>${dl("out")||'<div class="mut">None recorded.</div>'}<button onclick="openDebt('out')">Add a debt I owe</button>
 <h2>Owed to me</h2>${dl("in")||'<div class="mut">Customers who took stock on credit, or people you lent to.</div>'}<button onclick="openDebt('in')">Add money owed to me</button>`}
async function setOwePrompt(sim){const v=await askText(`What do you owe Fuliza now${multiSim()?" on "+esc(simName(sim)):""}?`,"Dial *234# → Fuliza M-PESA → Balance","","number");if(v==null||v==="")return;const d=setFzOwed(P(),sim,+v,"set from *234#");save();render();toast(Math.abs(d)<1?"Already matches ✓":"Fuliza set to "+K(+v))}
async function setLimPrompt(sim){const v=await askText("Your Fuliza limit","e.g. 700",fzLimit(P(),sim)||"","number");if(v==null)return;P().fzl[sim]=+v||0;save();render()}
function openFz(id,sim){const p=P(),f=id?p.fz.find(x=>x.id==id):{d:today(),b:"p",sim:sim||SIM0()};openS(`<h2 style="margin-top:0">${id?"Edit Fuliza":"Log Fuliza"}</h2>
 <label>Amount borrowed (KSh)</label><input id="fa1" type="number" inputmode="decimal" value="${f.a??""}"><label>Date borrowed</label><input id="fd" type="date" value="${f.d}">
 ${multiSim()?`<label>Line (SIM)</label><select id="fs">${S.sims.map(s=>`<option value="${s.id}" ${simOf(f)==s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select>`:""}
 <label>Used for</label><select id="fb"><option value="p" ${f.b!="b"?"selected":""}>Personal</option><option value="b" ${f.b=="b"?"selected":""}>Business</option></select>
 <label>Access fee (KSh, from the Fuliza message)</label><input id="fac" type="number" inputmode="decimal" value="${f.acc??""}" placeholder="Leave empty to estimate 1%">
 ${id?`<label>Already repaid of what was borrowed (KSh)</label><input id="frp" type="number" inputmode="decimal" value="${f.rp||0}"><label>Fees already paid (KSh)</label><input id="ffp" type="number" inputmode="decimal" value="${f.fp||0}"><label class="chk"><input type="checkbox" id="fdn" ${f.done?"checked":""}> Fully repaid</label>`:""}
 <br><button onclick="saveFz(${id||0})">Save</button>${id&&!f.done?`<button class="g" style="margin-top:8px" onclick="fzDone(${id})">Record it as repaid now</button>`:""}`)}
function saveFz(id){const p=P(),a=parseFloat($("fa1").value);if(!a)return toast("Enter the amount");let f=id?p.fz.find(x=>x.id==id):null;if(!f){f={id:uid(),done:false};p.fz.push(f)}
 f.a=a;f.d=$("fd").value||today();f.b=$("fb").value;f.sim=$("fs")?$("fs").value:(f.sim||SIM0());const ac=$("fac").value;if(ac==="")delete f.acc;else f.acc=+ac;
 if(id){f.rp=Math.min(a,+$("frp").value||0);f.fp=+$("ffp").value||0;const dn=$("fdn").checked;if(dn){f.done=true;f.dd=f.dd||today();f.cost=f.fp}else{f.done=false;delete f.dd}}
 save();closeS();render();toast("Saved")}
async function delFz(id){if(!await ask("Remove this Fuliza record? Payments and repayments already recorded stay in your entries.","Remove"))return;const p=P();p.fz=p.fz.filter(f=>f.id!=id);p.tx.forEach(x=>{if(x.fzid==id){delete x.fzid;delete x.fzk}});save();render()}
function fzDone(id){const f=P().fz.find(x=>x.id==id),c=fzCost(f);openS(`<h2 style="margin-top:0">Fuliza repaid in full</h2><div class="mut">Use this only if the repayment isn’t already recorded through money you received. Check your M-Pesa message for the exact fees; the estimate is filled in.</div><label>Total Fuliza fees (KSh)</label><input id="a" type="number" inputmode="decimal" value="${Math.round(c.tot*100)/100}"><label>Date repaid</label><input id="rd" type="date" value="${today()}"><label>Repaid from</label><select id="m2"><option value="p" ${f.b!="b"?"selected":""}>Personal money</option><option value="b" ${f.b=="b"?"selected":""}>Business money</option></select><br><button onclick="fzOk(${id})">Save</button>`)}
function fzOk(id){const p=P(),f=p.fz.find(x=>x.id==id),fees=parseFloat($("a").value)||0,s=$("m2").value,d=$("rd").value||today(),lk=uid(),sim=simOf(f);
 const feeLeft=Math.max(0,fees-(f.fp||0)),pr=f.a-(f.rp||0);
 if(feeLeft>0){f.fp=(f.fp||0)+feeLeft;p.tx.push({id:uid(),ts:nts(),at:today(),d,t:"out",b:f.b||"p",s,a:feeLeft,m:"M-Pesa",sim,who:"Fuliza fees",c:"Fuliza fees",n:"Fuliza",fzid:f.id,fzk:"fp",lk})}
 if(pr>0){f.rp=(f.rp||0)+pr;p.tx.push({id:uid(),ts:nts(),at:today(),d,t:"out",b:f.b||"p",s,rp:1,a:pr,m:"M-Pesa",sim,who:"Fuliza repayment",c:"Fuliza repayment",n:"repaid",fzid:f.id,fzk:"rp",lk})}
 f.done=true;f.dd=d;f.cost=f.fp||0;save();closeS();render()}
function openDebt(dir,id){const d=id?P().debts.find(x=>x.id==id):{paid:[]};openS(`<h2 style="margin-top:0">${id?"Edit":dir=="out"?"New debt or loan I owe":"Money owed to me"}</h2><label>${dir=="out"?"Owed to (e.g. Equity loan)":"Who owes me"}</label><input id="w" value="${esc(d.who||"")}"><label>Amount ${id?"":"borrowed"}</label><input id="a" type="number" inputmode="decimal" value="${d.a||""}"><label>Due date (optional)</label><input id="u" type="date" value="${d.due||""}">
 ${dir=="out"?`<label>Interest and fees per month (KSh, optional)</label><input id="mc" type="number" inputmode="decimal" value="${d.mc||""}" placeholder="from your loan statement"><label>What I can pay each month (KSh, optional)</label><input id="mpy" type="number" inputmode="decimal" value="${d.mp||""}">`:""}
 ${id?`<label>Already ${dir=="out"?"paid":"received"} (KSh)</label><input id="pdx" type="number" inputmode="decimal" value="${d.paid.reduce((s,x)=>s+x.a,0)}"><div class="mut">Changing this only changes the record here, not your entries.</div>`:""}<br><button onclick="addDebt('${dir}',${id||0})">Save</button>`)}
function addDebt(dir,id){const a=parseFloat($("a").value),w=$("w").value.trim();if(!a||!w)return toast("Add a name and an amount");const p=P(),ex={mc:$("mc")?+$("mc").value||0:0,mp:$("mpy")?+$("mpy").value||0:0};
 if(id){const d=p.debts.find(x=>x.id==id);Object.assign(d,{who:w,a,due:$("u").value},ex);const want=+$("pdx").value||0,has=d.paid.reduce((s,x)=>s+x.a,0);if(Math.abs(want-has)>=0.01)d.paid.push({a:want-has,d:today(),adj:1})}else p.debts.push(Object.assign({id:uid(),dir,who:w,a,due:$("u").value,paid:[]},ex));save();closeS();render()}
function payDebt(id){const d=P().debts.find(x=>x.id==id),o=d.dir=="out";openS(`<h2 style="margin-top:0">${o?"Pay":"Received from"} ${esc(d.who)}</h2><label>Amount</label><input id="a" type="number" inputmode="decimal" value="${o&&d.mp?d.mp:""}"><label>${o?"Paid with":"Came into"}</label><select id="m">${PAYW().filter(([v])=>v!="Fuliza").map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("")}</select>${multiSim()?`<label>Line (if M-Pesa)</label><select id="dsim">${S.sims.map(z=>`<option value="${z.id}" ${z.id==simHere()?"selected":""}>${esc(z.name)}</option>`).join("")}</select>`:""}<label>Charges (KSh, optional)</label><input id="df" type="number" inputmode="decimal"><label>${o?"Paid from":"Goes into"}</label><select id="ds"><option value="p">Personal money</option><option value="b">Business money</option></select><br><button onclick="doPay(${id})">Save</button>`)}
function doPay(id){const a=parseFloat($("a").value);if(!a)return;const p=P(),d=p.debts.find(x=>x.id==id),s2=$("ds").value,o=d.dir=="out",pw=$("m").value,L=pw=="M-Pesa"?{m:"M-Pesa",sim:$("dsim")?$("dsim").value:simHere()}:legFields(pw);
 const x=Object.assign({id:uid(),ts:nts(),at:today(),d:today(),t:o?"out":"in",b:s2,s:s2,a,f:parseFloat($("df").value)||0,who:d.who,c:o?"Loan repayment":(s2=="b"?"Customer payment":"Other"),n:o?"loan/debt payment":"debt repaid to me"},L);if(o)x.loan=d.id;p.tx.push(x);if(o)loanLink(p,x);else d.paid.push({a,d:today(),tx:x.id});save();closeS();render();if(d.a-d.paid.reduce((q,e)=>q+e.a,0)<=0.5){confetti();toast(d.who+" cleared ✦")}}
async function delDebt(id){if(await ask("Delete this record? Payments already made stay in your history.","Delete")){P().debts=P().debts.filter(d=>d.id!=id);save();render()}}

 ${S.sims.map(s=>`<div class="row" style="border:0;padding:4px 0"><input id="sn_${s.id}" value="${esc(s.name)}"><label class="chk" style="margin:0;white-space:nowrap;font-size:13px"><input type="checkbox" id="so_${s.id}" ${s.own=="b"?"checked":""}> Business</label>${S.sims.length>1?`<button class="x" onclick="rmSim('${s.id}')" aria-label="Remove line">✕</button>`:""}</div>`).join("")}<button class="g sm" onclick="addSim()">＋ Add a line</button>
 <h2>My accounts and savings places</h2><div class="mut">Banks, cash and savings apps. Each keeps its own balance. The rate (% a year) is used to estimate interest on savings.</div>
 ${S.accts.map(a=>`<div class="card" style="padding:8px 10px;margin:6px 0"><div class="row" style="border:0;padding:0;gap:6px"><input id="an_${a.id}" value="${esc(a.name)}" style="flex:2;min-width:0"><select id="at_${a.id}" style="flex:1.3;min-width:0">${["bank","save","cash"].map(t=>`<option value="${t}" ${a.type==t?"selected":""}>${TYPEN[t]}</option>`).join("")}</select><input id="ar_${a.id}" type="number" step="0.1" value="${a.rate||""}" placeholder="% yr" style="flex:.9;min-width:0"><button class="x" onclick="rmAcct('${a.id}')" aria-label="Remove">✕</button></div><label class="chk" style="margin:6px 0 0;font-size:13px"><input type="checkbox" id="ao_${a.id}" ${a.own=="b"?"checked":""}> Mainly business money</label></div>`).join("")}<button class="g sm" onclick="addAcct()">＋ Add an account</button>
 <h2>My own categories</h2><div class="mut">Add new ones any time from a category list (“＋ New category…”), e.g. Delivery or Packaging.</div>
 ${["p","b","ip","ib"].flatMap(k=>((S.xc||{})[k]||[]).map((c,i)=>`<div class="row"><span>${esc(c)} <span class="pill">${{p:"personal",b:"business",ip:"money in",ib:"business money in"}[k]}</span></span><button class="x" onclick="rmCat('${k}',${i})">✕</button></div>`)).join("")||'<div class="mut" style="margin-top:6px">None yet.</div>'}
 <h2>Plan and money</h2><label>My monthly pay from the business (KSh)</label><input id="opay" type="number" inputmode="decimal" value="${S.ownPay||""}" placeholder="e.g. 30000"><div class="mut">Anything you take from business money for personal things counts towards this. The app warns you when you go over.</div>
 <label>Giving (firstfruits) % of income for the plan</label><input id="gv" type="number" step="0.5" value="${S.give??10}">
 <label>Emergency fund target, in months of essentials</label><input id="efm" type="number" value="${S.efm||3}">
 <label>Personal money I had before my first entry (KSh)</label><input id="ob1" type="number" value="${(p.ob||{}).p||""}"><label>Business money I had before my first entry (KSh)</label><input id="ob2" type="number" value="${(p.ob||{}).b||""}">
 <label>Fuliza access fee %</label><input id="fa" type="number" step="0.1" value="${S.fa??1}"><label>Fuliza excise on daily fee %</label><input id="fe" type="number" value="${S.fe??20}">
 <label>Cashback % on payments made with Ziidi (0 if you don’t get any)</label><input id="zr" type="number" value="${S.zr}">
 <label>New PIN (leave empty to keep the current one)</label><input id="pin" type="password" inputmode="numeric" value="">
 <br><button onclick="saveSet()">Save</button><h2>Bible verses</h2><button class="g" onclick="openVerses()">My verses (NKJV, GNB, TPT…)</button>
 <h2>Online backup</h2><div class="mut">${cst}</div><div class="btns"><button class="g" onclick="cloudNow(1).then(()=>openSet())">Back up now</button><button class="g" onclick="cloudRestore()">Restore</button></div>
 <h2>If something goes wrong</h2><div class="btns"><button class="g" onclick="exp()">Back up my data</button><button class="g" onclick="imp()">Restore a backup</button></div><div class="btns"><button class="g" onclick="mrg()">Combine copies</button><button class="g" onclick="csv()">Copy as CSV</button></div><div class="btns"><button class="g" onclick="undoDel()">Undo last delete</button><button class="g" onclick="rmPin()">Remove PIN</button></div><div class="btns"><button class="g" onclick="wipe(false)">Erase this tab</button><button class="g" onclick="wipe(true)">Erase everything</button></div><div class="mut" style="margin-top:8px">${stat()}</div><div style="text-align:center;margin:18px 0 4px;font-weight:700;color:var(--acc)">Version 15 ✦</div>`)}
function simNames(){S.sims.forEach(s=>{const e=$("sn_"+s.id),o=$("so_"+s.id);if(e&&e.value.trim())s.name=e.value.trim();if(o)s.own=o.checked?"b":"p"});if($("opay"))S.ownPay=+$("opay").value||0;(S.accts||[]).forEach(a=>{const n=$("an_"+a.id),t=$("at_"+a.id),r=$("ar_"+a.id);if(n&&n.value.trim())a.name=n.value.trim();if(t)a.type=t.value;if(r)a.rate=+r.value||0;const o=$("ao_"+a.id);if(o)a.own=o.checked?"b":"p"})}
function addAcct(){simNames();S.accts.push({id:"a"+Date.now().toString(36),name:"New account",type:"bank"});save();openSet()}
async function rmAcct(id){simNames();const used=S.p.some(p=>p.tx.some(x=>acOf(x)==id));if(!await ask(used?"Remove this account? Its past entries stay, but they won’t count towards any account balance.":"Remove this account?","Remove"))return openSet();S.accts=S.accts.filter(a=>a.id!=id);S.p.forEach(p=>{delete p.acb[id]});save();openSet()}
function addSim(){simNames();S.sims.push({id:"s"+Date.now().toString(36),name:"Line "+(S.sims.length+1)});save();openSet()}
async function rmSim(id){simNames();const keepTo=S.sims.find(s=>s.id!=id),used=S.p.some(p=>p.tx.some(x=>x.sim==id)||p.fz.some(f=>f.sim==id));
 if(!await ask(used?`Remove this line? Its entries and Fuliza will move to “${esc(keepTo.name)}”.`:"Remove this line?","Remove"))return openSet();
 S.p.forEach(p=>{p.tx.forEach(x=>{if(x.sim==id)x.sim=keepTo.id});p.fz.forEach(f=>{if(f.sim==id)f.sim=keepTo.id});if(p.mpw)delete p.mpw[id];if(p.fzl)delete p.fzl[id]});
 S.sims=S.sims.filter(s=>s.id!=id);if(pendSim==id)pendSim=null;save();openSet()}
function rmCat(k,i){simNames();S.xc[k].splice(i,1);save();openSet()}
async function h(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ec"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function saveSet(){const p=P();simNames();p.name=$("nm").value||p.name;p.zf=$("zf").value=="1";p.ob={p:+$("ob1").value||0,b:+$("ob2").value||0};S.zr=$("zr").value===""?0:+$("zr").value;S.give=+$("gv").value||0;S.efm=+$("efm").value||3;S.fa=$("fa").value===""?1:+$("fa").value;S.fe=$("fe").value===""?20:+$("fe").value;const n=$("pin").value;if(n)S.pin=await h(n);save();closeS();render();toast("Settings saved")}
function stat(){let s;try{localStorage.setItem("t","1");localStorage.removeItem("t");s="Saving on this phone: working ✓"}catch(e){s="⚠ This browser is blocking saving on the phone."}return s+" · Last backup: "+(S.lb||"never")+" · "+cst}
function banner(){const n=S.p.reduce((s,p)=>s+p.tx.length,0),d=S.lb?(Date.now()-new Date(S.lb))/864e5:999,w=stat().includes("⚠");return w&&!ccol?`<div class="card bad"><b>⚠ Saving is blocked</b><div class="mut">Your entries may be lost. Open the app in normal (not private) Chrome, or use the online link while signed in.</div></div>`:n>0&&d>7&&!ccol?`<div class="card bad"><b>Time for a backup</b><div class="mut">Last backup: ${S.lb||"never"}. Tap “Back up my data” at the bottom.</div></div>`:""}
function showText(t,note,txt,ro,btn){openS(`<h2 style="margin-top:0">${t}</h2><div class="mut">${note}</div><textarea id="bk" ${ro?"readonly":""} style="height:170px;margin:8px 0">${esc(txt)}</textarea>${btn}`)}
function exp(){showText("Back up","Copy this text and keep it safe: a note to yourself, WhatsApp, or email.",JSON.stringify(S),true,'<button onclick="cp()">Copy</button>')}
async function cp(){const t=$("bk");t.select();let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){try{ok=document.execCommand("copy")}catch(e2){}}if(ok){S.lb=today();save();toast("Copied")}else toast("Press and hold the text, then Select all and Copy")}
function imp(){showText("Restore","Paste your backup text here. This replaces everything now in the app. Backups from the old version work too.","",false,'<button onclick="restore()">Restore</button>')}
async function restore(){let j;try{j=JSON.parse($("bk").value)}catch(e){return tell("That doesn’t look like an Eshet Chayil backup.")}if(!j||!(Array.isArray(j.p)||Array.isArray(j.tx)))return tell("That doesn’t look like an Eshet Chayil backup.");
 if(await ask("Replace everything in the app with this backup?","Replace")){S=migrate(j);S.cur=0;save();closeS();render();toast("Restored")}}
function csv(){const r=["tab,date,type,kind,amount,fee,how,line,who,category,note"];S.p.forEach(p=>p.tx.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(x=>r.push([p.name,x.d,x.t=="in"?"in":"out",x.b=="b"?"business":"personal",x.a,x.f,x.m,x.m=="M-Pesa"?simName(simOf(x)):"",x.who,x.c,x.n].map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(","))));showText("Spreadsheet","Copy and paste into Excel or Google Sheets.",r.join("\n"),true,'<button onclick="cp()">Copy</button>')}
async function rmPin(){if(await ask("Remove the PIN?","Remove")){S.pin="";save();toast("PIN removed")}}
function fresh(){S=migrate({p:[mkP("Jackie",true),mkP("Exarkie",false)],cur:0,zr:4,pin:""})}
async function wipe(all){if(!await ask(all?"Erase EVERYTHING in the app? Back up first.":"Erase all entries in this tab? Back up first.","Erase"))return;if(all)fresh();else{const p=P();p.tx=[];p.fz=[];p.debts=[];p.goals=[];p.bills=[];p.chk={}}save();closeS();render()}
async function forgot(){if(await ask("This erases everything in the app on this phone. You can restore from a backup afterwards. Continue?","Erase")){fresh();save();$("lock").style.display="none";render()}}
function openVerses(){const mv=S.mv||[];openS(`<h2 style="margin-top:0">My verses</h2><div class="mut">Copy a verse from your Bible app (NKJV, GNB, TPT or any other) and add it here.</div><label>Show</label><select onchange="S.vm=this.value;save();render()"><option value="kjv" ${S.vm!="mine"&&S.vm!="both"?"selected":""}>Built-in KJV only</option><option value="both" ${S.vm=="both"?"selected":""}>KJV and my verses</option><option value="mine" ${S.vm=="mine"?"selected":""}>My verses only</option></select><label>Verse</label><textarea id="vx"></textarea><label>Reference (e.g. Proverbs 31:25)</label><input id="vr"><label>Translation (e.g. NKJV)</label><input id="vt"><br><button onclick="addV()">Add verse</button><h2>Added so far</h2>${mv.map((x,i)=>`<div class="row"><span class="mut">${esc(x[1])} (${esc(x[2])})</span><button class="x" onclick="delV(${i})">✕</button></div>`).join("")||'<div class="mut">None yet.</div>'}`)}
function addV(){const t=$("vx").value.trim(),r=$("vr").value.trim(),tr=$("vt").value.trim()||"My Bible";if(!t||!r)return;(S.mv=S.mv||[]).push([t,r,tr]);if(!S.vm||S.vm=="kjv")S.vm="both";save();openVerses();render()}
function delV(i){S.mv.splice(i,1);save();openVerses();render()}
function mrg(){showText("Combine two copies","Paste the backup text from your other copy (offline or online). Nothing is deleted: entries missing here are added.","",false,'<button onclick="doMerge()">Combine</button>')}
function doMerge(){let j;try{j=migrate(JSON.parse($("bk").value))}catch(e){return tell("That doesn’t look like an Eshet Chayil backup.")}if(!j||!Array.isArray(j.p))return tell("That doesn’t look like an Eshet Chayil backup.");let n=0;
 j.p.forEach((q,i)=>{const p=S.p.find(x=>x.name.toLowerCase()==String(q.name).toLowerCase())||S.p[i];if(!p)return;
 ["tx","fz","debts","goals","bills"].forEach(k=>{(q[k]||[]).forEach(it=>{const m=(p[k]||[]).find(y=>y.id==it.id);if(!m){p[k].push(it);n++}else if(k=="fz"&&it.done&&!m.done){Object.assign(m,it);n++}else if(k=="debts"&&(it.paid||[]).length>(m.paid||[]).length){m.paid=it.paid;n++}else if(k=="goals"&&(it.saved||[]).length>(m.saved||[]).length){m.saved=it.saved;n++}})});
 Object.assign(p.chk,q.chk||{});for(const kk of["p","b"])for(const[c,v]of Object.entries((q.bud||{})[kk]||{}))if(!p.bud[kk][c])p.bud[kk][c]=v;});
 (j.sims||[]).forEach(z=>{if(!S.sims.some(y=>y.id==z.id))S.sims.push(z)});["p","b","ip","ib"].forEach(k=>((j.xc||{})[k]||[]).forEach(c=>{S.xc[k]=S.xc[k]||[];if(!S.xc[k].includes(c))S.xc[k].push(c)}));(j.mv||[]).forEach(v=>{S.mv=S.mv||[];if(!S.mv.some(y=>y[0]==v[0]&&y[1]==v[1])){S.mv.push(v);n++}});
 save();closeS();render();tell("Combined. "+n+" items added or updated.")}

/* ---------- Online backup (claude.ai signed-in) ---------- */
let ccol=null,ctm=null,cst="Online backup: not available here, so use “Back up my data” every week";
async function initCloud(){try{if(!window.claude||!claude.use)return;const[u,db]=await Promise.all([claude.use("user"),claude.use("db")]);if(!u||!db){cst="Online backup: sign in to claude.ai to turn it on";return}const id=await u.id();if(!id){cst="Online backup: sign in to claude.ai to turn it on";return}ccol=db.collection("data/users/"+id).doc("eshet");
 const s=await ccol.get(),n=S.p.reduce((a,p)=>a+p.tx.length,0);
 if(s.exists){const c=s.data();let cj=null;try{cj=JSON.parse(c.json)}catch(e){}if(cj&&Array.isArray(cj.p)){const cn=cj.p.reduce((a,p)=>a+p.tx.length,0);if(n==0&&cn>0){S=migrate(cj);save();render();cst="Online backup: restored your saved data ✓";return}if((c.at||0)>(S.ts||0)+5000&&cn>0&&await ask("Your online backup is newer than the data on this phone. Use the online backup?","Use online","Keep this phone’s")){S=migrate(cj);save();render();cst="Online backup: restored ✓";return}}}
 cst="Online backup: on ✓";cloudSoon()}catch(e){cst="Online backup: couldn’t connect"}}
function cloudSoon(){if(!ccol)return;clearTimeout(ctm);ctm=setTimeout(cloudNow,3000)}
async function cloudNow(manual){if(!ccol){if(manual)await tell("Online backup isn’t available here. Use the online link while signed in to claude.ai.");return}try{await ccol.set({json:JSON.stringify(S),at:Date.now()});cst="Online backup: saved at "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" ✓";if(manual)toast("Backed up online")}catch(e){cst="Online backup: failed, will retry on the next change"}}
async function cloudRestore(){if(!ccol)return tell("Online backup isn’t available here.");try{const s=await ccol.get();if(!s.exists)return tell("No online backup yet.");const j=JSON.parse(s.data().json);if(await ask("Replace everything on this phone with your online backup?","Replace")){S=migrate(j);save();closeS();render()}}catch(e){tell("Couldn’t read the online backup.")}}
setTimeout(initCloud,300);

/* ---------- Lock ---------- */
function lock(){if(!S.pin){render();return}const l=$("lock");l.style.display="flex";l.innerHTML=`<h1>Eshet Chayil</h1><div class="mut">Enter your PIN</div><input id="lp" type="password" inputmode="numeric" style="max-width:220px;text-align:center" onkeydown="if(event.key=='Enter')unlock()"><button style="max-width:220px" onclick="unlock()">Open</button><button class="g" style="max-width:220px" onclick="forgot()">Forgot PIN</button>`}
async function unlock(){if(await h($("lp").value)==S.pin){$("lock").style.display="none";render()}else{$("lp").value="";$("lp").placeholder="Wrong PIN, try again"}}
{const h0=location.hash.slice(1);if(["home","all","plan","save","owe","rep"].includes(h0))tab=h0;try{history.replaceState({t:tab},"","#"+tab)}catch(e){}}
lock();
</script></body></html>
